name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile work_countdown.py work_core.py holiday_sync.py work_stats.py app_updates.py desktop_hotkeys.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ruff
        run: python -m ruff check work_core.py holiday_sync.py work_stats.py app_updates.py desktop_hotkeys.py work_countdown.py tests
      - name: Mypy
        run: python -m mypy work_core.py holiday_sync.py work_stats.py app_updates.py desktop_hotkeys.py
      - name: Build EXE
        shell: powershell
        run: .\build_exe.ps1
      - name: Packaged smoke test
        shell: powershell
        run: .\smoke_exe.ps1
